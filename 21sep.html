<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skyblock Yellow Bloom - Noche y Lluvia</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }
    .watermark {
        position: absolute;
        bottom: 15px;
        right: 20px;
        color: rgba(255, 255, 255, 0.4); 
        font-family: monospace;
        font-size: 14px;
        font-weight: bold;
        z-index: 10;
        pointer-events: none; 
        user-select: none;
}
    body {
      background-color: #bcd5e6;
      overflow: hidden;
      font-family: monospace;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      display: block;
    }
    .hud-top {
      position: absolute;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
      z-index: 10;
    }
    .badge {
      background: rgba(20, 24, 28, 0.5);
      border: 2px solid rgba(255, 255, 255, 0.15);
      padding: 8px 18px;
      border-radius: 4px;
      color: #ffd633;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 3px;
      backdrop-filter: blur(4px);
    }
    .controls-bar {
      position: absolute;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      z-index: 10;
    }
    .btn {
      background: rgba(20, 24, 28, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #e0e5eb;
      font-family: monospace;
      font-size: 12px;
      font-weight: 600;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      backdrop-filter: blur(4px);
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .btn:hover, .btn.active {
      background: rgba(40, 48, 56, 0.9);
      color: #ffd633;
      border-color: rgba(255, 214, 51, 0.5);
      transform: translateY(-2px);
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div class="hud-top">
    <div class="badge">21.09 • SKYBLOCK</div>
  </div>

  <div class="controls-bar">
    <button class="btn active" id="btn-day">Día</button>
    <button class="btn" id="btn-sunset">Atardecer</button>
    <button class="btn" id="btn-rain">Lluvia</button>
  </div>
  <div class="watermark">noothh</div>
  <div id="canvas-container"></div>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('canvas-container');
      const scene = new THREE.Scene();
      
      let currentSkyColor = new THREE.Color('#bcd5e6');
      let targetSkyColor = new THREE.Color('#bcd5e6');
      scene.background = currentSkyColor;
      scene.fog = new THREE.Fog(currentSkyColor, 15, 45);

      const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(6, 4, 10);

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      container.appendChild(renderer.domElement);

      const controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.minDistance = 2.5;
      controls.maxDistance = 25;
      controls.target.set(0, 1.2, 0);
      controls.maxPolarAngle = Math.PI; 

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
      let targetAmbColor = new THREE.Color(0xffffff);
      let targetAmbInt = 0.85;
      scene.add(ambientLight);

      // Luz direccional principal que alternará entre el sol y la luna
      const dirLight = new THREE.DirectionalLight(0xfffdf5, 1.2);
      dirLight.castShadow = true;
      dirLight.shadow.mapSize.width = 2048;
      dirLight.shadow.mapSize.height = 2048;
      dirLight.shadow.camera.near = 0.5;
      dirLight.shadow.camera.far = 40;
      const d = 8;
      dirLight.shadow.camera.left = -d;
      dirLight.shadow.camera.right = d;
      dirLight.shadow.camera.top = d;
      dirLight.shadow.camera.bottom = -d;
      scene.add(dirLight);

      const lightningLight = new THREE.PointLight(0xffffff, 0, 50);
      lightningLight.position.set(0, 15, 0);
      scene.add(lightningLight);
      let lightningFlash = 0;

      let targetLightColor = new THREE.Color(0xfffdf5);
      let targetLightInt = 1.2;
      let currentSunPos = new THREE.Vector3(12, 18, 10);
      let targetSunPos = new THREE.Vector3(12, 18, 10);

      const boxGeo = new THREE.BoxGeometry(1, 1, 1);
      
      // Sol con material neon (fog: false hace que brille sin ser afectado por la neblina)
      const sunMat = new THREE.MeshBasicMaterial({ color: 0xffdd44, fog: false });
      const sunMesh = new THREE.Mesh(boxGeo, sunMat);
      sunMesh.scale.set(2.5, 2.5, 2.5);
      scene.add(sunMesh);

      // Luna, polos opuestos
      const moonMat = new THREE.MeshBasicMaterial({ color: 0xddeeff, fog: false });
      const moonMesh = new THREE.Mesh(boxGeo, moonMat);
      moonMesh.scale.set(2.2, 2.2, 2.2);
      scene.add(moonMesh);

      const matGrass = new THREE.MeshLambertMaterial({ color: 0x5c8a38 });
      const matDirt = new THREE.MeshLambertMaterial({ color: 0x513722 });
      const matStem = new THREE.MeshLambertMaterial({ color: 0x3e6d23 });
      const matCore = new THREE.MeshLambertMaterial({ color: 0x3d2311 });
      const matCloud = new THREE.MeshLambertMaterial({ color: 0xffffff, transparent: true, opacity: 0.85, depthWrite: false });
      const matWood = new THREE.MeshLambertMaterial({ color: 0x47341e });
      const matLeaves = new THREE.MeshLambertMaterial({ color: 0x3a7322 });
      
      const matPetalSun1 = new THREE.MeshLambertMaterial({ color: 0xffcd03 });
      const matPetalSun2 = new THREE.MeshLambertMaterial({ color: 0xee9c00 });
      const matPetalPoppy = new THREE.MeshLambertMaterial({ color: 0xcc2222 });
      const matPetalDandelion = new THREE.MeshLambertMaterial({ color: 0xffdd22 });
      const matPetalOrchid = new THREE.MeshLambertMaterial({ color: 0x55aaff });

      const islandGroup = new THREE.Group();
      const islandRadius = 4.2;

      for (let x = -5; x <= 5; x++) {
        for (let z = -5; z <= 5; z++) {
          const dist = Math.sqrt(x * x + z * z);
          if (dist <= islandRadius) {
            const top = new THREE.Mesh(boxGeo, matGrass);
            top.position.set(x, 0, z);
            top.receiveShadow = true;
            top.castShadow = true;
            islandGroup.add(top);

            const depth = Math.floor((islandRadius - dist) * 0.8) + 1;
            for (let y = 1; y <= depth; y++) {
              const dirt = new THREE.Mesh(boxGeo, matDirt);
              dirt.position.set(x, -y, z);
              dirt.receiveShadow = true;
              dirt.castShadow = true;
              islandGroup.add(dirt);
              
              if (y === depth && Math.random() > 0.7) {
                const vineLen = Math.floor(Math.random() * 3) + 1;
                for (let v = 1; v <= vineLen; v++) {
                  const vine = new THREE.Mesh(boxGeo, matLeaves);
                  vine.scale.set(0.2, 1, 0.2);
                  vine.position.set(x + (Math.random()-0.5)*0.5, -y - v + 0.5, z + (Math.random()-0.5)*0.5);
                  vine.castShadow = true;
                  islandGroup.add(vine);
                }
              }
            }
          }
        }
      }
      scene.add(islandGroup);

      const treeGroup = new THREE.Group();
      treeGroup.position.set(-2, 1, -2);
      
      for (let i = 0; i < 5; i++) {
        const log = new THREE.Mesh(boxGeo, matWood);
        log.position.set(0, i, 0);
        log.castShadow = true;
        log.receiveShadow = true;
        treeGroup.add(log);
      }
      
      for (let x = -2; x <= 2; x++) {
        for (let y = 3; y <= 6; y++) {
          for (let z = -2; z <= 2; z++) {
            if (x === 0 && z === 0 && y < 5) continue;
            if (Math.abs(x) === 2 && Math.abs(z) === 2 && y >= 4) continue;
            if (Math.abs(x) >= 1 && Math.abs(z) >= 1 && y === 6) continue;
            
            const leaf = new THREE.Mesh(boxGeo, matLeaves);
            leaf.position.set(x, y, z);
            leaf.castShadow = true;
            leaf.receiveShadow = true;
            treeGroup.add(leaf);
          }
        }
      }
      scene.add(treeGroup);

      const chickenGroup = new THREE.Group();
      const matWhite = new THREE.MeshLambertMaterial({color: 0xffffff});
      const matRed = new THREE.MeshLambertMaterial({color: 0xff0000});
      const matYellow = new THREE.MeshLambertMaterial({color: 0xffaa00});
      const matBlack = new THREE.MeshBasicMaterial({color: 0x111111});

      const cBody = new THREE.Mesh(boxGeo, matWhite);
      cBody.scale.set(0.4, 0.3, 0.5);
      cBody.position.set(0, 0.35, 0);
      cBody.castShadow = true;
      chickenGroup.add(cBody);

      const cHead = new THREE.Mesh(boxGeo, matWhite);
      cHead.scale.set(0.2, 0.3, 0.2);
      cHead.position.set(0, 0.6, 0.35);
      cHead.castShadow = true;
      chickenGroup.add(cHead);

      const cEyeL = new THREE.Mesh(boxGeo, matBlack);
      cEyeL.scale.set(0.04, 0.04, 0.04);
      cEyeL.position.set(-0.1, 0.65, 0.46);
      chickenGroup.add(cEyeL);

      const cEyeR = new THREE.Mesh(boxGeo, matBlack);
      cEyeR.scale.set(0.04, 0.04, 0.04);
      cEyeR.position.set(0.1, 0.65, 0.46);
      chickenGroup.add(cEyeR);

      const cBeak = new THREE.Mesh(boxGeo, matYellow);
      cBeak.scale.set(0.1, 0.05, 0.15);
      cBeak.position.set(0, 0.6, 0.5);
      chickenGroup.add(cBeak);

      const cWattle = new THREE.Mesh(boxGeo, matRed);
      cWattle.scale.set(0.08, 0.1, 0.08);
      cWattle.position.set(0, 0.5, 0.45);
      chickenGroup.add(cWattle);

      const cLegL = new THREE.Mesh(boxGeo, matYellow);
      cLegL.scale.set(0.05, 0.2, 0.05);
      cLegL.position.set(-0.1, 0.1, 0);
      chickenGroup.add(cLegL);

      const cLegR = new THREE.Mesh(boxGeo, matYellow);
      cLegR.scale.set(0.05, 0.2, 0.05);
      cLegR.position.set(0.1, 0.1, 0);
      chickenGroup.add(cLegR);

      chickenGroup.position.set(1.5, 0.5, 1.5);
      let chickenTarget = new THREE.Vector3(1.5, 0.5, 1.5);
      scene.add(chickenGroup);

      const cloudsRing = new THREE.Group();
      const cloudCount = 18;
      for (let i = 0; i < cloudCount; i++) {
        const ang = (i / cloudCount) * Math.PI * 2;
        const rad = 15 + Math.random() * 8;
        const h = 10 + Math.random() * 6;
        const cl = new THREE.Mesh(boxGeo, matCloud);
        cl.scale.set(4 + Math.random() * 3, 0.6, 2.5 + Math.random() * 2);
        cl.position.set(Math.cos(ang) * rad, h, Math.sin(ang) * rad);
        cl.rotation.y = -ang + Math.PI / 2;
        cl.castShadow = true;
        cloudsRing.add(cl);
      }
      scene.add(cloudsRing);

      const rainCount = 1200;
      let rainIntensity = 0;
      let targetRainIntensity = 0;
      const rainGeo = new THREE.BoxGeometry(0.03, 0.4, 0.03);
      const rainMat = new THREE.MeshBasicMaterial({ color: 0xa9c4d9, transparent: true, opacity: 0 });
      const rainMesh = new THREE.InstancedMesh(rainGeo, rainMat, rainCount);
      const rainData = [];
      const dummy = new THREE.Object3D();

      for (let i = 0; i < rainCount; i++) {
        rainData.push({
          x: (Math.random() - 0.5) * 20,
          y: Math.random() * 20 + 2,
          z: (Math.random() - 0.5) * 20,
          s: Math.random() * 0.3 + 0.4
        });
        dummy.position.set(rainData[i].x, rainData[i].y, rainData[i].z);
        dummy.updateMatrix();
        rainMesh.setMatrixAt(i, dummy.matrix);
      }
      rainMesh.visible = false;
      scene.add(rainMesh);

      const flowers = [];
      const interactive = [];

      function createFlower(type, x, z, scale = 1) {
        const g = new THREE.Group();
        g.position.set(x, 0.5, z);
        g.scale.set(0.01, 0.01, 0.01);
        g.targetScale = scale * 0.65;

        const stem = new THREE.Mesh(boxGeo, matStem);
        stem.scale.set(0.07, 0.9, 0.07);
        stem.position.set(0, 0.45, 0);
        stem.castShadow = true;
        g.add(stem);

        const head = new THREE.Group();
        head.position.set(0, 0.9, 0);

        let petalsColors = [];
        let hitBox = null;

        if (type === 'sunflower') {
          const leaf = new THREE.Mesh(boxGeo, matStem);
          leaf.scale.set(0.24, 0.05, 0.12);
          leaf.position.set(0.12, 0.35, 0);
          leaf.rotation.z = -0.3;
          g.add(leaf);

          const core = new THREE.Mesh(boxGeo, matCore);
          core.scale.set(0.3, 0.3, 0.15);
          core.castShadow = true;
          head.add(core);
          hitBox = core;

          const petals = [
            [0, 0.28, 0], [0, -0.28, 0], [0.28, 0, 0], [-0.28, 0, 0],
            [0.2, 0.2, 0], [-0.2, 0.2, 0], [0.2, -0.2, 0], [-0.2, -0.2, 0]
          ];
          petals.forEach((pos, idx) => {
            const mat = idx % 2 === 0 ? matPetalSun1 : matPetalSun2;
            const pet = new THREE.Mesh(boxGeo, mat);
            pet.scale.set(0.18, 0.18, 0.12);
            pet.position.set(pos[0], pos[1], pos[2]);
            pet.castShadow = true;
            head.add(pet);
          });
          head.rotation.x = -0.2;
          petalsColors = [matPetalSun1, matPetalSun2];
        } else if (type === 'poppy') {
          const core = new THREE.Mesh(boxGeo, matPetalSun1);
          core.scale.set(0.1, 0.1, 0.1);
          core.position.set(0, 0.1, 0);
          head.add(core);
          hitBox = core;
          
          const pet = new THREE.Mesh(boxGeo, matPetalPoppy);
          pet.scale.set(0.4, 0.3, 0.4);
          pet.castShadow = true;
          head.add(pet);
          petalsColors = [matPetalPoppy];
        } else if (type === 'dandelion') {
          const pet = new THREE.Mesh(boxGeo, matPetalDandelion);
          pet.scale.set(0.3, 0.2, 0.3);
          pet.castShadow = true;
          head.add(pet);
          hitBox = pet;
          petalsColors = [matPetalDandelion];
        } else if (type === 'blue_orchid') {
          const p1 = new THREE.Mesh(boxGeo, matPetalOrchid);
          p1.scale.set(0.1, 0.4, 0.1);
          p1.position.set(-0.1, 0, 0);
          head.add(p1);
          const p2 = new THREE.Mesh(boxGeo, matPetalOrchid);
          p2.scale.set(0.1, 0.3, 0.1);
          p2.position.set(0.1, -0.05, 0);
          head.add(p2);
          hitBox = p1;
          petalsColors = [matPetalOrchid];
        }

        g.add(head);

        g.userData = {
          swayOffset: Math.random() * Math.PI * 2,
          head: head,
          colors: petalsColors
        };

        scene.add(g);
        flowers.push(g);
        interactive.push(hitBox);
        return g;
      }

      createFlower('sunflower', -0.5, 2.5, 1.0);
      createFlower('sunflower', 1.5, -0.5, 1.05);
      createFlower('sunflower', 3.0, 1.0, 0.9);

      const particles = [];
      const particleGeo = new THREE.BoxGeometry(0.06, 0.06, 0.06);

      function burstParticles(pos, colors) {
        for (let i = 0; i < 12; i++) {
          const mat = colors[Math.floor(Math.random() * colors.length)];
          const p = new THREE.Mesh(particleGeo, mat);
          p.position.copy(pos);
          p.velocity = new THREE.Vector3(
            (Math.random() - 0.5) * 3,
            Math.random() * 2 + 1.5,
            (Math.random() - 0.5) * 3
          );
          p.life = 1.0;
          scene.add(p);
          particles.push(p);
        }
      }

      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2();
      const flowerTypes = ['sunflower', 'poppy', 'dandelion', 'blue_orchid'];

      window.addEventListener('pointerdown', (e) => {
        if (e.button !== 0) return; 
        if (e.target.tagName === 'BUTTON') return;
        mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);
        const hits = raycaster.intersectObjects([...islandGroup.children, ...interactive]);

        if (hits.length > 0) {
          const hit = hits[0];
          if (interactive.includes(hit.object)) {
            const fParent = hit.object.parent.parent;
            burstParticles(hit.point, fParent.userData.colors);
          } else {
            const p = hit.point;
            if (Math.abs(p.x) < islandRadius && Math.abs(p.z) < islandRadius && p.y > 0.4) {
              const rType = flowerTypes[Math.floor(Math.random() * flowerTypes.length)];
              const newF = createFlower(rType, p.x, p.z, Math.random() * 0.25 + 0.85);
              burstParticles(new THREE.Vector3(p.x, 0.5, p.z), newF.userData.colors);
            }
          }
        }
      });

      window.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        if (e.target.tagName === 'BUTTON') return;
        mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);
        const hits = raycaster.intersectObjects(islandGroup.children);

        if (hits.length > 0) {
          const p = hits[0].point;
          if (Math.abs(p.x) < islandRadius && Math.abs(p.z) < islandRadius && p.y > 0.4) {
            chickenTarget.set(p.x, 0.5, p.z);
          }
        }
      });

      const btnDay = document.getElementById('btn-day');
      const btnSunset = document.getElementById('btn-sunset');
      const btnRain = document.getElementById('btn-rain');

      function clearActive() {
        btnDay.classList.remove('active');
        btnSunset.classList.remove('active');
        btnRain.classList.remove('active');
      }

      btnDay.addEventListener('click', () => {
        clearActive();
        btnDay.classList.add('active');
        targetSkyColor.set('#bcd5e6');
        targetLightColor.set('#fffdf5');
        targetAmbColor.set('#ffffff');
        targetSunPos.set(12, 18, 10);
        targetLightInt = 1.2;
        targetAmbInt = 0.85;
        targetRainIntensity = 0;
      });

      btnSunset.addEventListener('click', () => {
        clearActive();
        btnSunset.classList.add('active');
        targetSkyColor.set('#f4a261');
        targetLightColor.set('#ffcc88');
        targetAmbColor.set('#f4a261');
        targetSunPos.set(-15, 2.5, -15);
        targetLightInt = 1.3;
        targetAmbInt = 0.6;
        targetRainIntensity = 0;
      });

      btnRain.addEventListener('click', () => {
        clearActive();
        btnRain.classList.add('active');
        // Noche y lluvia
        targetSkyColor.set('#10141a');
        targetLightColor.set('#788b99'); // Luz de luna
        targetAmbColor.set('#202530');
        targetSunPos.set(-4, -20, -4); // El sol baja, la luna sube
        targetLightInt = 0.5;
        targetAmbInt = 0.5;
        targetRainIntensity = 1;
      });

      const clock = new THREE.Clock();

      function animate() {
        requestAnimationFrame(animate);
        const elapsed = clock.getElapsedTime();

        currentSkyColor.lerp(targetSkyColor, 0.02);
        scene.background = currentSkyColor;
        scene.fog.color.copy(currentSkyColor);

        dirLight.color.lerp(targetLightColor, 0.02);
        dirLight.intensity += (targetLightInt - dirLight.intensity) * 0.02;

        ambientLight.color.lerp(targetAmbColor, 0.02);
        ambientLight.intensity += (targetAmbInt - ambientLight.intensity) * 0.02;

        currentSunPos.lerp(targetSunPos, 0.015);
        sunMesh.position.copy(currentSunPos);
        
        // Luna siempre opuesta al sol
        moonMesh.position.copy(currentSunPos).multiplyScalar(-1);

        // Hacer que la luz direccional siga al cuerpo celeste que esté más alto en el cielo
        if (sunMesh.position.y >= moonMesh.position.y) {
          dirLight.position.copy(sunMesh.position);
        } else {
          dirLight.position.copy(moonMesh.position);
        }

        cloudsRing.rotation.y = elapsed * 0.012;

        rainIntensity += (targetRainIntensity - rainIntensity) * 0.03;
        rainMat.opacity = rainIntensity * 0.6;
        
        if (rainIntensity < 0.01) {
          rainMesh.visible = false;
        } else {
          rainMesh.visible = true;
          for (let i = 0; i < rainCount; i++) {
            const d = rainData[i];
            d.y -= d.s * (rainIntensity * 1.5 + 0.5);
            if (d.y < -5) {
              d.y = 22;
              d.x = (Math.random() - 0.5) * 20;
              d.z = (Math.random() - 0.5) * 20;
            }
            dummy.position.set(d.x, d.y, d.z);
            dummy.updateMatrix();
            rainMesh.setMatrixAt(i, dummy.matrix);
          }
          rainMesh.instanceMatrix.needsUpdate = true;

          if (Math.random() < 0.003 && lightningFlash <= 0) {
            lightningFlash = 1.0;
          }
        }

        if (lightningFlash > 0) {
          lightningLight.intensity = lightningFlash * 8.0;
          lightningFlash -= 0.05;
        } else {
          lightningLight.intensity = 0;
        }

        const dist = chickenGroup.position.distanceTo(chickenTarget);
        if(dist > 0.1) {
          const dir = new THREE.Vector3().subVectors(chickenTarget, chickenGroup.position).normalize();
          chickenGroup.position.addScaledVector(dir, 0.04);
          chickenGroup.position.y = 0.5 + Math.abs(Math.sin(elapsed * 15)) * 0.15;
          
          const lookTarget = chickenTarget.clone();
          lookTarget.y = chickenGroup.position.y;
          chickenGroup.lookAt(lookTarget);
        } else {
          chickenGroup.position.y = 0.5 + Math.abs(Math.sin(elapsed * 3)) * 0.03;
        }

        flowers.forEach(f => {
          if (f.scale.x < f.targetScale) {
            f.scale.lerp(new THREE.Vector3(f.targetScale, f.targetScale, f.targetScale), 0.1);
          }
          f.rotation.z = Math.sin(elapsed * 1.8 + f.userData.swayOffset) * 0.035;
          if (f.userData.head.children.length > 2) { 
            f.userData.head.rotation.y = Math.cos(elapsed * 1.4 + f.userData.swayOffset) * 0.06;
          }
        });

        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.position.addScaledVector(p.velocity, 0.016);
          p.velocity.y -= 0.06;
          p.rotation.x += 0.04;
          p.rotation.y += 0.04;
          p.life -= 0.025;
          p.scale.setScalar(Math.max(0, p.life));

          if (p.life <= 0) {
            scene.remove(p);
            particles.splice(i, 1);
          }
        }

        controls.update();
        renderer.render(scene, camera);
      }

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      animate();
    });
  </script>
</body>
</html>
